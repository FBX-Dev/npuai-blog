# Sveltia CMS 配置 —— NPU AI 博客后台
# 后台地址：https://www.npuai.cn/admin/
# 登录方式：GitHub 账号授权，或粘贴 GitHub Personal Access Token（需 repo 权限）

backend:
  name: github
  repo: FBX-Dev/npuai-blog
  branch: main
  auth_methods: [token]
  commit_messages:
    create: '内容：新增 {{collection}} “{{slug}}”'
    update: '内容：更新 {{collection}} “{{slug}}”'
    delete: '内容：删除 {{collection}} “{{slug}}”'
    uploadMedia: '内容：上传图片 “{{path}}”'
    deleteMedia: '内容：删除图片 “{{path}}”'

# 允许中文标题直接生成文件名（否则中文字符会被清空导致文件名为空）
slug:
  encoding: unicode
  clean_accents: false

locale: zh_Hans
site_url: https://www.npuai.cn
display_url: https://www.npuai.cn
logo_url: https://www.npuai.cn/assets/home/default-logo.webp

# 图片上传到 public/images/uploads，文章里写 /images/uploads/xxx.webp 即可
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 保存后会提交到 GitHub，并自动重新构建发布（约 2 分钟生效）
    folder: src/content/posts
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: published
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 用于列表页预览与 SEO 描述
      - label: 封面图
        name: image
        widget: image
        required: false
        choose_url: false
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 分类
        name: category
        widget: string
        required: false
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        hint: 打开后不会发布到线上
      - label: 置顶
        name: pinned
        widget: boolean
        default: false
      - label: 正文
        name: body
        widget: markdown

  - name: pages
    label: 独立页面
    files:
      - label: 关于本站
        name: about
        file: src/content/spec/about.md
        fields:
          - label: 正文
            name: body
            widget: markdown

  - name: settings
    label: 站点设置
    description: 站点级配置。「顶部导航菜单」控制网站最上面那排菜单，可以直接跳站内页面，也可以挂外链（比如 token.npuai.cn）做引流。保存后提交到 GitHub 并自动重新构建发布（约 2 分钟生效）
    files:
      - label: 顶部导航菜单
        name: navigation
        file: src/data/navigation.json
        fields:
          - label: 菜单项
            name: links
            label_singular: 菜单项
            widget: list
            min: 1
            summary: '{{fields.name}}  →  {{fields.url}}'
            hint: 上下的顺序＝菜单从左到右的顺序，拖动条目左侧的手柄可以调整顺序。
            fields:
              - label: 名称
                name: name
                widget: string
                hint: 菜单上显示的文字，尽量短（建议 2–6 个字）
              - label: 链接
                name: url
                widget: string
                hint: 站内页面写 /archive/ 这种格式（以斜杠开头和结尾）。本站可用：/ 首页、/archive/ 归档、/about/ 关于。跳站外要写完整地址，例如 https://token.npuai.cn
              - label: 图标
                name: icon
                widget: string
                required: false
                default: ''
                hint: Iconify 图标名，例如 material-symbols:home。只能填 material-symbols / mdi / fa7-solid / fa7-regular / fa7-brands / simple-icons 里真实存在的图标，填错就不显示图标。屏幕窄的时候菜单只显示图标、隐藏文字，所以建议每项都填。挑图标：https://icon-sets.iconify.design/
              - label: 在新标签页打开（外链）
                name: external
                widget: boolean
                default: false
                hint: 跳站外建议开启。开启后会在新标签页打开，并显示一个外链小标识
              - label: 子菜单
                name: children
                widget: list
                required: false
                summary: '{{fields.name}}'
                hint: 留空就是普通菜单项；填了会变成鼠标悬停展开的下拉菜单
                fields:
                  - label: 名称
                    name: name
                    widget: string
                  - label: 链接
                    name: url
                    widget: string
                  - label: 图标
                    name: icon
                    widget: string
                    required: false
                    default: ''
                  - label: 在新标签页打开（外链）
                    name: external
                    widget: boolean
                    default: false
